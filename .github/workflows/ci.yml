name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        name: Install pnpm
        with:
          version: 12
          runtime: node@26
          cache: true
      - run: pnpm build
